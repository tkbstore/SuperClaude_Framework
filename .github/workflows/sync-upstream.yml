name: Sync Upstream

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no changes detected'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/SuperClaude-Org/SuperClaude_Framework.git || true
          git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/master)

          echo "local=$LOCAL_HEAD" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_HEAD" >> $GITHUB_OUTPUT

          # Check if upstream has commits not in our master
          NEW_COMMITS=$(git rev-list HEAD..upstream/master --count)
          echo "new_commits=$NEW_COMMITS" >> $GITHUB_OUTPUT

          if [ "$NEW_COMMITS" -eq 0 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No new upstream commits. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Found $NEW_COMMITS new upstream commits."
          fi

      - name: Check for existing sync PR
        if: steps.check.outputs.skip == 'false'
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "auto-sync/upstream" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "Open sync PR already exists: #$EXISTING. Updating it."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update sync branch
        if: steps.check.outputs.skip == 'false'
        id: merge
        run: |
          # Delete old sync branch if it exists (remote)
          git push origin --delete auto-sync/upstream 2>/dev/null || true

          # Create fresh sync branch from current master
          git checkout -b auto-sync/upstream

          # Attempt merge
          if git merge upstream/master --no-edit; then
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "Merge succeeded cleanly."
          else
            # If merge conflicts, abort and record
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
            echo "Merge has conflicts. PR will note this."
          fi

      - name: Push sync branch (clean merge)
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        run: |
          git push origin auto-sync/upstream --force

      - name: Create or update PR (clean merge)
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHORT=$(echo "${{ steps.check.outputs.upstream }}" | cut -c1-7)
          NEW_COMMITS="${{ steps.check.outputs.new_commits }}"

          # Close existing PR if any (we force-pushed the branch)
          if [ "${{ steps.existing-pr.outputs.exists }}" = "true" ]; then
            gh pr close "${{ steps.existing-pr.outputs.pr_number }}" --delete-branch=false 2>/dev/null || true
          fi

          gh pr create \
            --title "chore: sync upstream ($NEW_COMMITS new commits, up to $UPSTREAM_SHORT)" \
            --body "$(cat <<'BODY'
          ## Upstream Sync

          This PR merges new commits from `SuperClaude-Org/SuperClaude_Framework` master.

          - **New upstream commits**: COMMITS_PLACEHOLDER
          - **Upstream HEAD**: UPSTREAM_PLACEHOLDER
          - **Merge result**: Clean (no conflicts)

          ### What to do
          - Review the changes to make sure nothing conflicts with your customizations
          - Merge when ready (merge commit recommended, not squash)

          ---
          *Auto-generated by sync-upstream workflow*
          BODY
          )" \
            --base master \
            --head auto-sync/upstream \
            --label "upstream-sync" 2>/dev/null || \
          gh pr create \
            --title "chore: sync upstream ($NEW_COMMITS new commits, up to $UPSTREAM_SHORT)" \
            --body "## Upstream Sync

          Merges $NEW_COMMITS new commits from upstream (up to $UPSTREAM_SHORT).
          Clean merge, no conflicts. Review and merge when ready.

          *Auto-generated by sync-upstream workflow*" \
            --base master \
            --head auto-sync/upstream

      - name: Handle conflicts (notify only)
        if: steps.check.outputs.skip == 'false' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHORT=$(echo "${{ steps.check.outputs.upstream }}" | cut -c1-7)

          # Create an issue instead of a broken PR
          EXISTING_ISSUE=$(gh issue list --label "upstream-sync-conflict" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "Upstream sync conflict: manual merge needed ($UPSTREAM_SHORT)" \
              --body "## Merge Conflict with Upstream

          The automated sync found conflicts when merging \`upstream/master\` ($UPSTREAM_SHORT).

          ### Manual resolution

          \`\`\`bash
          git fetch upstream master
          git checkout -b fix/upstream-sync
          git merge upstream/master
          # Resolve conflicts
          git add .
          git commit
          git push origin fix/upstream-sync
          # Create PR from fix/upstream-sync -> master
          \`\`\`

          *Auto-generated by sync-upstream workflow*" \
              --label "upstream-sync-conflict"
          fi
